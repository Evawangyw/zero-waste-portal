# 零废弃知识库 · 自建前后端 Docker Compose（T00 空壳）
# ⚠️ 本文件只含「前端 + 后端」两个服务；WeKnora 五容器由其官方 compose 单独管理，不在此重复声明。
# 用法：
#   1) cp deploy/.env.example backend/.env 并填入真实值（切勿提交）
#   2) docker compose -f deploy/docker-compose.yml up --build
#   3) 前端 http://localhost:8080  |  后端 http://localhost:4000/health -> {"ok":true}

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: zw-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      NODE_ENV: production
      PORT: '4000'
    ports:
      - '4000:4000'
    volumes:
      # SQLite 落在 backend/data/app.db（相对 prisma/schema.prisma 的 ../data）
      - ../backend/data:/app/backend/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>r.json()).then(j=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    container_name: zw-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
